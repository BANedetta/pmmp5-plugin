name: Main Workflow

on:
  push:
    branches:
      - stable
      - main
  pull_request:
    branches:
      - stable
  workflow_dispatch:

jobs:
  setup-env:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - name: Copy scripts to root
        run: |
          cp -r .github/workflows/scripts .

      - name: Check if virions.yml exists
        id: check-virions
        run: |
          if [ ! -f virions.yml ]; then
            echo "virions.yml не найден!"
            echo "virion=not_found" >> $GITHUB_ENV
          else
            echo "virions.yml найден."
            echo "virion=found" >> $GITHUB_ENV
          fi

      - name: Read build settings
        id: read-settings
        run: |
          if [ ! -f build_settings.yml ]; then
            echo "build_settings.yml не найден!"
            exit 1
          fi
          virions=$(yq e '.virions' build_settings.yml)
          composer=$(yq e '.composer' build_settings.yml)
          echo "virions=$virions" >> $GITHUB_ENV
          echo "composer=$composer" >> $GITHUB_ENV

  build-virions:
    needs: setup-env
    if: success() && env.virion == 'found' && env.virions == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y unzip curl jq yq

      - name: Process virions
        run: |
          mkdir -p virions
          while IFS= read -r line
          do
            repo=$(echo "$line" | awk '{print $2}')
            echo "Загрузка $repo..."

            repo_info=$(curl -s "https://api.github.com/repos/$repo")
            branch=$(echo "$repo_info" | jq -r '.default_branch // "main"')
            repo_url="https://github.com/$repo/archive/refs/heads/$branch.zip"

            echo "Скачивание архива $repo_url..."
            curl -L "$repo_url" -o repo.zip
            unzip repo.zip -d repo
            rm repo.zip

            extracted_path=$(find repo -maxdepth 1 -type d | grep -v '^repo$' | head -n 1)/$(echo "$line" | awk '{print $4}')
            if [ ! -d "$extracted_path" ]; then
              echo "Ошибка: Папка $(echo "$line" | awk '{print $4}') не найдена."
              exit 1
            fi

            cp scripts/virion_build.php "$extracted_path/build.php"

            echo "Запуск сборки..."
            cd "$extracted_path" && php build.php && cd -

            if [ ! -f "$extracted_path/virion.phar" ]; then
              echo "Ошибка: Файл virion.phar не был создан!"
              exit 1
            fi

            mv "$extracted_path/virion.phar" "virions/$(basename "$repo").phar"
            rm -rf repo
          done < <(yq e '.[] | .repo + " " + .src' virions.yml)

  build-plugin:
    needs: setup-env
    runs-on: ubuntu-latest
    steps:
      - name: Copy scripts to root
        run: |
          cp -r .github/workflows/scripts .

      - name: Check if composer.json exists and install dependencies
        if: env.composer == 'true'
        run: |
          if [ ! -f composer.json ]; then
            echo "composer.json не найден!"
          else
            echo "composer.json найден."
            composer install --no-dev --optimize-autoloader
          fi

      - name: Build plugin
        run: |
          cp scripts/plugin_build.php ./build.php
          php build.php

      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: plugin
          path: plugin.phar